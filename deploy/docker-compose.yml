# Этот файл живёт на сервере в /opt/kosynka. CI кладёт его туда через rsync
# на каждом деплое — правки коммитятся сюда, а не редактируются на сервере.
#
# Три контейнера: caddy, app и db. Наружу смотрит только caddy — он держит
# 80 и 443 и сам получает и продлевает сертификат по ACME; app доступен
# исключительно по compose-сети (expose, не ports), база — тем более.
# Устройство TLS и запасной путь с сертификатом на голый IP — в docs/tls.md.
#
# Рядом на сервере лежат файлы, которых нет в git (создаются один раз руками):
#   .env.db   — POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   .env.app  — KOSYNKA_DATABASE_URL с тем же паролем
#   .env.site — SITE_ADDR и ACME_EMAIL для Caddy
#   .env      — IMAGE_TAG, перезаписывается каждым деплоем

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env.db
    # Наружу не публикуется: до базы достаёт только приложение по compose-сети.
    # Чтобы заглянуть руками — docker compose exec db psql -U kosynka kosynka
    volumes:
      # В postgres:18 том — /var/lib/postgresql, а не /var/lib/postgresql/data,
      # как было до 18. По старому пути данные молча не сохраняются.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ghcr.io/costigun/kosynka-backend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.app
    environment:
      # Не секреты — правятся коммитом в этот файл.
      # База рядом, в контейнере: max_connections по умолчанию 100,
      # так что пул в 10 соединений её не стеснит.
      KOSYNKA_DB_POOL_SIZE: "10"
      # Параметры кривой опыта. Правятся здесь и применяются перезапуском
      # контейнера, без пересборки образа. Значения совпадают с дефолтами
      # XpConfig — расхождение означало бы, что поведение с пустым окружением
      # и с заданным разное.
      KOSYNKA_XP_BASE: "100"
      KOSYNKA_XP_TARGET_SECONDS: "300"
      KOSYNKA_XP_K_MIN: "0.5"
      KOSYNKA_XP_K_MAX: "2.0"
      KOSYNKA_XP_LEVEL_BASE: "200"
      KOSYNKA_XP_LEVEL_GROWTH: "1.25"
    expose:
      # Наружу не публикуется: снаружи смотрит Caddy, он же терминирует TLS.
      - "8000"
    healthcheck:
      # /healthz намеренно не трогает базу: моргнувший Postgres не должен
      # перезапускать контейнер.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *logging

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env.site
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  # Данные базы переживают перезапуск и передеплой. Удаление тома
  # (docker compose down -v) стирает весь прогресс игроков.
  pgdata:
  # Сертификаты и ACME-аккаунт. Потерять этот том — значит выпустить всё заново
  # и рискнуть упереться в лимит Let's Encrypt (50 сертификатов на домен в неделю).
  caddy_data:
  caddy_config:
