name: CI/CD

# Пуш в main = «доставить на сервер». Деплой стоит за тестами в одном workflow,
# поэтому раскатиться в обход красных тестов нельзя.
on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"
  IMAGE: ghcr.io/costigun/kosynka-backend

jobs:
  quality:
    name: Линт, типы, тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kosynka
          POSTGRES_PASSWORD: kosynka
          POSTGRES_DB: kosynka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kosynka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KOSYNKA_DATABASE_URL: postgresql+asyncpg://kosynka:kosynka@localhost:5432/kosynka_test
    steps:
      - uses: actions/checkout@v7

      - name: Установить Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: poetry.lock соответствует pyproject.toml
        run: poetry check --lock

      - name: Зависимости
        run: poetry install

      - name: ruff
        run: |
          poetry run ruff check app tests
          poetry run ruff format --check app tests

      - name: mypy
        run: poetry run mypy app

      - name: Юнит-тесты
        run: poetry run pytest tests/unit -q

      - name: Миграции накатываются и совпадают с моделями
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

      - name: API-тесты
        run: poetry run pytest tests/api -q

  deploy:
    name: Деплой на сервер
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    # Два деплоя одновременно подрались бы за compose на сервере; очередь,
    # но без отмены — прерванный на середине деплой оставляет мусор.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Логин в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить образ
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          # Тег по коммиту, а не latest: видно, что именно крутится, и возможен откат.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ssh отдаёт код 255 на любую беду — от пустого секрета до неверного
      # ключа хоста. Эти два шага превращают его в осмысленное сообщение.
      - name: Проверить, что секреты заданы
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing"
            exit 1
          fi
          echo "Все четыре секрета заданы."

      - name: Настроить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ключ хоста берётся из секрета, а не через ssh-keyscan на месте:
          # keyscan доверяет тому, кто ответил, и защищает ровно ни от чего.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Ключ, вставленный одной строкой или без строк BEGIN/END, даёт
          # неотличимый на глаз отказ. Здесь он отваливается сразу и по делу.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY не разбирается как приватный ключ — проверь, что вставлен весь файл, вместе со строками -----BEGIN/END-----"
            exit 1
          fi

          # Хост в known_hosts должен совпадать с SSH_HOST посимвольно,
          # иначе ssh скажет «Host key verification failed».
          if ! grep -q "^${SSH_HOST} " ~/.ssh/known_hosts; then
            echo "::error::SSH_KNOWN_HOSTS не содержит записи для ${SSH_HOST}. Пересними её: ssh-keyscan -t ed25519 ${SSH_HOST}"
            exit 1
          fi

      - name: Проверить доступ к серверу
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$TARGET" 'echo "вход выполнен $(whoami)@$(hostname)"'

      - name: Доставить конфиги и перезапустить
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          # cloud-init.yaml нужен только при создании ВМ — на работающем сервере
          # ему делать нечего.
          rsync -az --exclude='.env*' --exclude='cloud-init.yaml' deploy/ "$TARGET:/opt/kosynka/"
          ssh "$TARGET" "IMAGE_TAG=${{ github.sha }} bash /opt/kosynka/release.sh"
